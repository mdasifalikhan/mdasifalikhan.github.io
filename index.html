<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asif Ali Khan - Developer Website</title>
    <style>
        :root {
            --primary: #7C6AFF;
            --primary-accent: #6AE5FF;
            --bg: #0F172A;
            --surface: #1E293B;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --green: #81C784;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 40px;
            background-color: var(--surface);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .logo-box {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--primary-accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 8px 20px rgba(124, 106, 255, 0.3);
        }

        .logo-icon {
            font-size: 36px;
            color: white;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <span class="logo-icon">&#x1F4A1;</span>
        </div>
        <h1>Asif Ali Khan</h1>
        <p class="subtitle">Developer of Ai Education and more Android apps.</p>
        
        <div class="links">
            <a href="https://play.google.com/store/apps/details?id=com.ai.education" class="btn btn-primary" target="_blank">Ai Education on Google Play</a>
            <a href="https://github.com/mdasifalikhan" class="btn btn-secondary" target="_blank">GitHub Profile</a>
        </div>

        <div class="footer">
            &copy; 2026 Asif Ali Khan. All rights reserved.
        </div>
    </div>
</body>
</html>
